<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Tom Pham - Personal Desktop</title>
  <meta name="title" content="Tom Pham - Personal Desktop">
  <meta name="description"
    content="Tom Pham's personal desktop of projects, ideas, and digital experiences.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tom Pham - Personal Desktop">
  <meta property="og:description"
    content="Tom Pham's personal desktop of projects, ideas, and digital experiences.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">


  <meta property="twitter:title" content="Tom Pham - Personal Desktop">
  <meta name="twitter:title" content="Tom Pham - Personal Desktop">

  <meta property="twitter:description"
    content="Tom Pham's personal desktop of projects, ideas, and digital experiences.">
  <meta name="twitter:description"
    content="Tom Pham's personal desktop of projects, ideas, and digital experiences.">


  <!-- og:url / og:image / twitter:image omitted until the site has a public domain; webpack cannot resolve root-relative paths here -->

  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4FJBF6WF60"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-4FJBF6WF60');
  </script>
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
</body>

</html>
